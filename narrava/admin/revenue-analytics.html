<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narrava Admin — Revenue &amp; Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css?v=20">
<link rel="stylesheet" href="../css/admin.css?v=3">
</head>
<body class="admin-page" data-page="revenue-analytics">

<div class="toast" id="toast"></div>

<div class="admin-shell">
  <nav class="admin-sidebar" id="adminSidebar"></nav>
  <main class="admin-main">

    <div class="admin-topbar">
      <div>
        <h1>Revenue &amp; Analytics</h1>
        <div class="admin-topbar-sub">Completed Paystack purchases, subscribers, coins and ads. Naira and dollars are always shown separately.</div>
      </div>
    </div>

    <!-- Everything below is filled by admin-revenue.js from
         admin_revenue_overview(p_days) only. -->
    <div class="rev-periods" id="revPeriods" role="group" aria-label="Period"></div>

    <div class="rev-tabs" id="revTabs" role="tablist" aria-label="Revenue sections"></div>
    <div id="revTabPanel" role="tabpanel"></div>

    <div class="admin-panel">
      <div class="admin-panel-head"><div><h2>Recent purchases</h2><div class="admin-panel-sub">The last 50 purchases, any status. Times are Lagos time.</div></div></div>
      <div id="revRecentWrap"></div>
    </div>

  </main>
</div>

<script src="../js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/shared-utils.js?v=7"></script>
<script src="../js/admin-shared.js?v=2"></script>
<script src="../js/admin-revenue.js?v=3"></script>
</body>
</html>

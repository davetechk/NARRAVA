<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narrava Admin — Series List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-page" data-page="series-list">

<div class="toast" id="toast"></div>

<div class="admin-shell">
  <nav class="admin-sidebar" id="adminSidebar"></nav>
  <main class="admin-main">

    <div class="admin-topbar">
      <div>
        <h1>Series List</h1>
        <div class="admin-topbar-sub">Every title on the platform, in one place</div>
      </div>
      <div class="admin-search-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input type="text" id="seriesListSearch" placeholder="Search series by title…">
      </div>
    </div>

    <div id="seriesListStatsRow"></div>

    <div class="admin-panel">
      <div class="admin-panel-head">
        <div><h2>All Series</h2><div class="admin-panel-sub">Manage titles, genres, and featured placement</div></div>
      </div>
      <div id="seriesListTableWrap"></div>
    </div>

  </main>
</div>

<script src="../js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/shared-utils.js"></script>
<script src="../js/admin-shared.js"></script>
<script src="../js/admin-series-list.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narrava Admin — Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-page" data-page="analytics">

<div class="toast" id="toast"></div>

<div class="admin-shell">
  <nav class="admin-sidebar" id="adminSidebar"></nav>
  <main class="admin-main">

    <div class="admin-topbar">
      <div>
        <h1>Analytics</h1>
        <div class="admin-topbar-sub">Real visits to the app itself — never admin activity</div>
      </div>
    </div>

    <div id="analyticsStatsRow"></div>

    <div class="admin-panel">
      <div class="admin-panel-head"><div><h2>Visits by Day</h2><div class="admin-panel-sub">Real daily visit counts</div></div></div>
      <div id="analyticsLineChart"></div>
      <div class="admin-helper-text" id="analyticsChartNote" style="margin-top:14px;"></div>
    </div>

  </main>
</div>

<script src="../js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/shared-utils.js"></script>
<script src="../js/admin-shared.js"></script>
<script src="../js/admin-analytics.js"></script>
</body>
</html>
